<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <title>recrutamento online</title>
        <meta> charset="UTF-8"
    </head>
    <body>
        <header>
            <h1>Recrutamento online</h1>
        </header>
        <main>
            <section>
                <h2>cadastre o seu curriculo</h2>
                <form action="#" method="post">
                    <p>preencha o formulario abaixo para se candidatar a vaga</p>
                    <fieldset>
                        <legend>Dados pessoais</legend>

                        <div>
                            <label for="nome_id">Nome completo:</label>
                            <input id="nome_id" name="nome" type="text">
                        </div>

                        <div>
                            <label for="telefone_id">Telefone:</label>
                            <input id="telefone_id" name="telefone" type="tel">
                        </div>
                        
                        <div>
                            <label for="email_id">email:</label>
                            <input id="email_id" name="email" type="email">
                        </div>

                        <div>
                            <label for="data_nasc_id">data de nascimento:</label>
                            <input id="data_nasc_id" name="data nascimento" type="date">
                        </div>

                        <fieldset>
                            <legend>Endereço</legend>

                            <div>
                                <label for="Logradouro_id">logradouro:</label>
                                <input id="logradouro_id" name="logradouro" type="text">
                            </div>

                            <div>
                                <label for="cidade_id">cidade:</label>
                                <input id="cidade_id" name="cidade" type="text">
                            </div>

                            <div>
                                <label for="numero_id">numero:</label>
                                <input id="numero_id" name="numero" type="number">
                            </div>
                        
                        </fieldset>
                    </fieldset>

                    <fieldset>
                        <legend>Resumo</legend>

                        <div>
                            <label for="Resumo_id">fale sobre voce</label>
                            <textarea id="Resumo_id"></textarea>
                        </div>

                    </fieldset>

                    <fieldset>
                        <legend>Nivel desejado:</legend>

                        <div>
                            <input id="nivel_estagio_id"
                                   name="nivel"
                                   type="radio"
                                   value="estagio">
                            <label for="nivel_estagio_id">estagio</label>
                        </div>

                        <div>
                            <input id="nivel_junior_id"
                                   name="nivel"
                                   type="radio"
                                   value="junior">
                            <label for="nivel_junior_id">junior</label>
                        </div>

                    </fieldset>

                    <fieldset>
                        <legend>Tecnologia que domina:</legend>

                        <div>
                            <input id="tec_html_id"
                                   name="tecnologias"
                                   type="checkbox"
                                   value="html">
                            <label for="tec_html_id">HTML</label>
                        </div>

                        <div>
                            <input id="tec_CSS_id"
                                   name="tecnologias"
                                   type="checkbox"
                                   value="CSS">
                            <label for="tec_CSS_id">CSS</label>
                        </div>

                        <div>
                            <input id="tec_js_id"
                                   name="tecnologias"
                                   type="checkbox"
                                   value="js">
                            <label for="tec_js_id">JS</label>
                        </div>

                    </fieldset>

                    <fieldset>
                        <legend>Grau de instrução</legend>

                        <div>
                            <label for="escolaridade_id">Escolaridade:</label>
                            <select id="escolaridade_id" name="Escolaridade">
                              <option value="medio">ensino medio</option>
                              <option value="graduação">graduação</option>
                              <option value="pos">pos-graduação</option>
                            </select>
                        </div>

                    </fieldset>

                    <div>
                        <button type="reset">Limpar dados</button>
                        <button type="submit">Enviar candidatura</button>
                    </div>
                    
                </form>
            </section>

        </main>
        <footer>
            <p>Todos os direitos reservados &copy;</p>
        </footer>
    </body>
<html>
